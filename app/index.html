<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast Cover Studio — GTA 6 style cover maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>Neon Coast Cover Studio</h1>
  <p>Turn a photo and a caption into GTA-style cover art, then export it as a PNG.</p>
</header>
<main class="studio">
  <aside class="controls" aria-label="Cover controls">
    <section>
      <h2>1 · Photo</h2>
      <div id="photo-picker" class="picker"></div>
    </section>
    <section>
      <h2>2 · Layout</h2>
      <div id="layout-picker" class="picker stack"></div>
    </section>
    <section>
      <h2>3 · Colour grade</h2>
      <div id="palette-picker" class="picker stack"></div>
    </section>
    <section>
      <h2>4 · Words</h2>
      <label class="field">Cover title
        <input id="title-input" type="text" maxlength="24" autocomplete="off">
      </label>
      <label class="field">Tagline
        <input id="tagline-input" type="text" maxlength="48" autocomplete="off">
      </label>
      <button id="undo-btn" type="button" class="action secondary">Undo last change</button>
    </section>
    <section>
      <h2>5 · Export PNG</h2>
      <div class="exports">
        <button id="export-1080x1080" type="button" class="action">1080 × 1080</button>
        <button id="export-1080x1350" type="button" class="action">1080 × 1350</button>
        <button id="export-1920x1080" type="button" class="action">1920 × 1080</button>
        <button id="export-all" type="button" class="action wide">Export all three sizes</button>
      </div>
    </section>
  </aside>
  <section class="stage-wrap" aria-label="Cover preview">
    <canvas id="stage" width="1080" height="1080"></canvas>
    <p id="status" role="status">Loading photos…</p>
  </section>
</main>
<footer class="footnote">
  <p>Sample photos are free to use. No Rockstar artwork, logo or font is used.</p>
</footer>
<script type="module" src="src/main.js"></script>
</body>
</html>
